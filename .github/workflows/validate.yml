name: Validate ConsulEase
on: [push, pull_request]
jobs:
  windows-setup:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm.cmd ci
      - name: Prepare database and verify repeatability
        run: |
          npm.cmd run setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm.cmd run typecheck
      - run: npm.cmd run build
      - name: Start app and validate the PostgreSQL-backed API
        run: |
          $server = Start-Process -FilePath node -ArgumentList @('node_modules/next/dist/bin/next', 'start', '--hostname', '127.0.0.1') -PassThru -RedirectStandardOutput .data/app.log -RedirectStandardError .data/app-error.log
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-RestMethod http://127.0.0.1:3000/api/health
                if ($health.status -eq 'ok' -and $health.database -eq 'ready') { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'Database-backed server did not become ready.' }
            npm.cmd run test:api
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-node-${{ matrix.node }}-logs
          path: |
            .data/database.log
            .data/app.log
            .data/app-error.log
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run setup
      - run: npm run typecheck && npm run build
      - name: Start production app and validate
        run: |
          npm run start > .data/app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health
          npm run test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-artifacts
          path: |
            playwright-report/
            test-results/
            .data/app.log
